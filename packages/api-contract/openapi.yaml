openapi: 3.0.3
info:
  title: Boilerplate API
  version: 0.1.0
  description: |
    Same-origin JSON API. Auth uses an HttpOnly `session` cookie.
    Unsafe methods (POST/PATCH) must also send the `X-CSRF-Token` header
    with the value of the readable `csrf_token` cookie (obtained via any
    safe GET, e.g. GET /api/auth/csrf).
servers:
  - url: /api
paths:
  /auth/csrf:
    get:
      summary: Obtain CSRF cookie (safe GET, sets csrf_token cookie)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
  /auth/login:
    post:
      summary: Login, sets HttpOnly session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/me:
    get:
      summary: Current authenticated user
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      summary: Logout, clears session cookie
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
  /orders/:
    get:
      summary: List my orders, newest first
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      summary: Create an open order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldError"
  /orders/{id}/status:
    patch:
      summary: Move an open order to done or cancelled
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStatusRequest"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Order is not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    FieldError:
      type: object
      required: [error, fields]
      properties:
        error:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 128
    Order:
      type: object
      required: [id, item, qty, status, createdAt]
      properties:
        id:
          type: string
        item:
          type: string
        qty:
          type: integer
        status:
          type: string
          enum: [open, done, cancelled]
        createdAt:
          type: string
          format: date-time
    CreateOrderRequest:
      type: object
      required: [item, qty]
      properties:
        item:
          type: string
          maxLength: 120
        qty:
          type: integer
          minimum: 1
          maximum: 9999
    SetStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [done, cancelled]
